name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Example report (fictional company, no network)
        if: matrix.node == 22
        run: npm run example
      - name: Committed example reports match the code
        if: matrix.node == 22
        run: git diff --exit-code -- examples/ || (echo "::error::examples/ is stale; commit the regenerated reports from the example-report artifact" && exit 1)
      - uses: actions/upload-artifact@v4
        if: always() && matrix.node == 22
        with:
          name: example-report
          path: |
            examples/report.html
            examples/report.pt-BR.html
